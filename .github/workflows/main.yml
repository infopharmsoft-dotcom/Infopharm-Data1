name: Notify Infopharm Static

on:
  push:
    paths:
      - 'drugs.json.gz'
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger static pages rebuild
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/infopharmsoft-dotcom/infopharm/dispatches \
            -d '{"event_type":"drugs-updated"}'
